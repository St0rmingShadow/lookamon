<header class="header">
    <a class="header__logo" routerLink="/search">
        <!-- The Logo Mark -->
        <svg class="header__logo-mark" viewBox="0 0 100 100" width="36" height="36">
            <!-- Top Half (Red) -->
            <path d="M 2 50 A 48 48 0 0 1 98 50 L 70 50 A 20 20 0 0 0 30 50 Z" fill="var(--lookamon-red)"></path>
            <!-- Bottom Half (Blue) -->
            <path d="M 2 50 A 48 48 0 0 0 98 50 L 70 50 A 20 20 0 0 1 30 50 Z" fill="var(--color-text-primary)"></path>
            <!-- Center Circle (Yellow) -->
            <circle cx="50" cy="50" r="20" fill="var(--lookamon-yellow)"></circle>
        </svg>

        <!-- The Wordmark -->
        <span>Lookamon</span>
    </a>

    <nav class="header__nav">
        <a class="header__link" routerLink="/search" routerLinkActive="header__link--active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
            </svg>
            Search
        </a>
        <a class="header__link" routerLink="/explore" routerLinkActive="header__link--active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            Explore
        </a>
        <a class="header__link" routerLink="/about" routerLinkActive="header__link--active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            About
        </a>
    </nav>

    <button class="header__theme-toggle" type="button" aria-label="Toggle theme" (click)="themeService.toggleTheme()">

        {{ themeService.isDarkMode() ? '☀️' : '🌙' }}

    </button>
</header>
