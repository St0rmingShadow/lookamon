<div class="search-bar">
    <span class="search-bar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
        </svg>
    </span>

    <input class="search-bar__input" type="text" placeholder="Search by name or ID..."
        aria-label="Search by name or ID" (input)="search.emit($any($event.target).value)"/>

    <button class="search-bar__button" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
        </svg>
    </button>
</div>
